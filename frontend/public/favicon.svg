<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Nacatamales de Doña Antonia">
  <title>Nacatamales de Doña Antonia</title>

  <!-- Sello: base crema de marca + aro achiote. -->
  <circle cx="24" cy="24" r="24" fill="#FFF4DC"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#9E2B25" stroke-width="3.5"/>

  <!-- Nacatamal envuelto en hoja de plátano.
       Toda la geometria cae DENTRO del viewBox 0 0 48 48. El simbolo
       anterior dibujaba el vapor en y=-2, fuera del lienzo, y el
       navegador lo recortaba. -->
  <g>
    <path
      d="M24 12.2c2.9 0 4.8 2 6 4.4l6 13.2c1.7 3.7-.7 7.6-4.8 7.6H16.8c-4.1 0-6.5-3.9-4.8-7.6l6-13.2c1.2-2.4 3.1-4.4 6-4.4z"
      fill="#C4841C"/>
    <!-- Mitad derecha mas oscura: la hoja girada deja ver el reverso -->
    <path
      d="M24 12.2c2.9 0 4.8 2 6 4.4l6 13.2c1.7 3.7-.7 7.6-4.8 7.6H24z"
      fill="#9C6111"/>

    <!-- Nervadura central: el pliegue donde se juntan las dos hojas.
         Las laterales se detienen antes del centro a proposito; si las
         tres convergieran en un punto la figura leeria como un simbolo
         y no como una hoja. -->
    <g stroke="#FFF4DC" fill="none" stroke-linecap="round">
      <path d="M24 13v23.4" stroke-width="1.6" opacity=".55"/>
      <path d="M14.2 28.2l8 5.2" stroke-width="1.1" opacity=".42"/>
      <path d="M33.8 28.2l-8 5.2" stroke-width="1.1" opacity=".42"/>
    </g>
  </g>
</svg>